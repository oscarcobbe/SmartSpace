name: Site health check

# Every 30 minutes (UTC). GitHub may delay by a few minutes during high-load
# periods — that's expected and fine for a health probe.
#
# In addition to this, /api/cron/health-check still runs daily at 07:45 UTC
# from Vercel (vercel.json) as a belt-and-braces fallback. If GitHub Actions
# is ever down, the Vercel cron still catches problems within a day.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: # manual trigger from the Actions tab for testing

# If a previous run is still in flight (e.g. the endpoint is slow), skip the
# next scheduled invocation rather than queueing it up. Avoids piling on a
# slow site with extra requests.
concurrency:
  group: health-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: Probe /api/cron/health-check
    runs-on: ubuntu-latest
    # Hard ceiling so a hung endpoint doesn't pin a runner and eat GitHub
    # Actions minutes. 6 min leaves headroom for two 90s probe attempts plus
    # the 20s retry pause, so a single slow cold start can't trip the ceiling.
    timeout-minutes: 6
    steps:
      - name: Hit the health-check endpoint
        env:
          # Repository secret. Set it once at:
          #   Settings → Secrets and variables → Actions → New repository secret
          #   Name:  CRON_SECRET
          #   Value: same string as the CRON_SECRET env var in Vercel
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET repository secret is not set."
            echo "::error::Add it under Settings, Secrets and variables, Actions."
            echo "::error::Use the same value as the CRON_SECRET env var in Vercel."
            exit 1
          fi

          # One probe of the endpoint. Prints the body to the log and returns 0
          # only when the site is healthy (HTTP 2xx and the JSON body is not
          # ok:false). --max-time 90 caps a single slow probe; --show-error
          # surfaces transport errors (DNS, TLS) clearly.
          probe() {
            local response http_code body
            response=$(curl --silent --show-error \
              --max-time 90 \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --header "User-Agent: github-actions-health-check/1.0" \
              --write-out "\n__HTTP_CODE__:%{http_code}" \
              https://smart-space.ie/api/cron/health-check) || return 1

            http_code=$(printf '%s\n' "$response" | awk -F: '/^__HTTP_CODE__:/ {print $2}')
            body=$(printf '%s\n' "$response" | sed '/^__HTTP_CODE__:/d')

            echo "HTTP ${http_code:-?}"
            echo "----- response body (first 4KB) -----"
            printf '%s\n' "$body" | head -c 4000
            echo
            echo "----- end body -----"

            if [ -z "${http_code:-}" ] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "Endpoint returned HTTP ${http_code:-NO_RESPONSE}."
              return 1
            fi
            if printf '%s\n' "$body" | grep -q '"ok":false'; then
              return 1
            fi
            return 0
          }

          # Try up to twice. A single miss is almost always a transient cold
          # start, or a GitHub-queued run hitting the site mid-deploy, not a
          # real outage, so retry once after a short pause before alerting. A
          # genuine failure still fails on the second attempt, and the endpoint
          # itself already Resend-alerts nigel@smart-space.ie on real failures.
          if probe; then
            echo "OK: site is healthy."
            exit 0
          fi

          echo "First probe did not pass, retrying in 20s (transient slowness / cold start)..."
          sleep 20

          if probe; then
            echo "OK: site is healthy on retry."
            exit 0
          fi

          echo "::error::Health check failed on two consecutive attempts, site may be unhealthy."
          exit 1
